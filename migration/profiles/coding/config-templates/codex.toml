[mcp_servers.ask_ai_coding]
command = "__MCP_CODING_EXE__"
enabled = false
required = false
enabled_tools = ["coding_backend_status", "coding_submit", "coding_status"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 20
tool_timeout_sec = 900

[mcp_servers.ask_ai_coding.env]
ASK_AI_MCP_CLIENT_NAME = "codex_desktop"
ASK_AI_MCP_CODING_REPOSITORIES = "__CODING_REPOSITORIES_JSON__"
ASK_AI_MCP_OPENCODE_ACCOUNT_UID = "__OPENCODE_ACCOUNT_UID__"
ASK_AI_MCP_OPENCODE_ACCOUNT_ALIAS = "__OPENCODE_ACCOUNT_ALIAS__"
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
